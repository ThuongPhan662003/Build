name: Build ISO with simple-cdd (download release debs + print errors)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install tools
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl jq gnupg bash \
            simple-cdd debian-cd xorriso genisoimage isolinux syslinux-common

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local-packages folder + symlink
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Folder bạn muốn chứa deb
          mkdir -p build-iso/extras/local-packages

          # Symlink để simple-cdd dễ pick theo cơ chế "extras/local-packages"
          mkdir -p extras
          ln -sfn ../build-iso/extras/local-packages extras/local-packages

          echo "=== Root ==="
          ls -la
          echo "=== build-iso/extras ==="
          ls -la build-iso/extras || true
          echo "=== build-iso/extras/local-packages ==="
          ls -la build-iso/extras/local-packages || true
          echo "=== extras/local-packages (symlink) ==="
          ls -la extras/local-packages || true

      - name: Download release assets into build-iso/extras/local-packages
        shell: bash
        env:
          GH_REPO: ThuongPhan662003/Build
          GH_TAG: deb-v0.0.1
          TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          OUT_DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          mkdir -p "$OUT_DIR"

          echo "Fetching release info: $GH_REPO tag=$GH_TAG"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/${GH_TAG}")"

          # asset id + name
          assets="$(echo "$release_json" | jq -r '.assets[] | "\(.id) \(.name)"')"

          if [ -z "$assets" ]; then
            echo "No assets found or token has no access."
            echo "$release_json" | jq -r '.message? // empty'
            exit 1
          fi

          echo "Assets:"
          echo "$assets"

          echo "Downloading to $OUT_DIR ..."
          echo "$assets" | while read -r id name; do
            [ -z "${id:-}" ] && continue
            echo " - id=$id name=$name"
            curl -fL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GH_REPO}/releases/assets/${id}" \
              -o "$OUT_DIR/$name"
          done

          echo "Downloaded files (head):"
          ls -lh "$OUT_DIR" | head -n 200
          echo "Deb count:"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.deb" | wc -l

      - name: Build ISO with simple-cdd (print exact error)
        shell: bash
        run: |
          set -euo pipefail
          set -x
          cd "$GITHUB_WORKSPACE"

          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          CONF="$GITHUB_WORKSPACE/simple-cdd.conf"
          LOG="$GITHUB_WORKSPACE/build-simple-cdd.log"

          trap 'rc=$?; echo "FAILED at line $LINENO: $BASH_COMMAND (exit=$rc)"; \
                echo "=== PWD ==="; pwd; \
                echo "=== ls -la (root) ==="; ls -la; \
                echo "=== ls -la build-iso/extras ==="; ls -la build-iso/extras || true; \
                echo "=== ls -la local-packages ==="; ls -la "$LOCAL_PKGS" || true; \
                echo "=== find simple-cdd.conf ==="; find . -maxdepth 3 -name "simple-cdd.conf" -print || true; \
                echo "=== tail build-simple-cdd.log ==="; tail -n 200 "$LOG" 2>/dev/null || echo "(no build-simple-cdd.log)"; \
                echo "=== tmp logs ==="; ls -la tmp 2>/dev/null || true; \
                find tmp -maxdepth 2 -type f -name "*.log" -print -exec tail -n 120 {} \; 2>/dev/null || true; \
                exit $rc' ERR

          echo "Using local packages dir: $LOCAL_PKGS"
          mkdir -p "$LOCAL_PKGS"
          test -f "$CONF"

          # Symlink để simple-cdd pick theo kiểu mặc định
          mkdir -p extras
          ln -sfn ../build-iso/extras/local-packages extras/local-packages

          echo "=== build-simple-cdd --help (first 80 lines) ==="
          build-simple-cdd --help | head -n 80 || true

          # Thử build có --local-packages (nếu tool không hỗ trợ, lỗi sẽ được in ra cụ thể)
          build-simple-cdd \
            --conf "$CONF" \
            --dist bookworm \
            --force-root \
            --verbose \
            --local-packages "$LOCAL_PKGS" \
            --logfile "$LOG"

          echo "ISO outputs:"
          ls -la images || true
          find images -maxdepth 1 -type f -name "*.iso" -print || true

      - name: Upload ISO + logs
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          if-no-files-found: error
          path: |
            images/*.iso
            build-simple-cdd.log
            simple-cdd.conf
