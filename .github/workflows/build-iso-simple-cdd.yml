name: Build ISO with simple-cdd (release debs + local packages)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install tools
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl jq gnupg bash \
            simple-cdd debian-cd xorriso genisoimage isolinux syslinux-common

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare local-packages folder + symlink extras/local-packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          mkdir -p build-iso/extras/local-packages
          mkdir -p extras
          ln -sfn ../build-iso/extras/local-packages extras/local-packages

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Tree (top):"
          ls -la
          echo "Check local-packages:"
          ls -la build-iso/extras || true
          ls -la build-iso/extras/local-packages || true
          ls -la extras/local-packages || true

      - name: Download private release assets into build-iso/extras/local-packages
        shell: bash
        env:
          GH_REPO: ThuongPhan662003/Build
          GH_TAG: deb-v0.0.1
          TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          OUT_DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          mkdir -p "$OUT_DIR"

          echo "Fetching release info: $GH_REPO tag=$GH_TAG"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/${GH_TAG}")"

          assets="$(echo "$release_json" | jq -r '.assets[] | "\(.id) \(.name)"')"

          if [ -z "$assets" ]; then
            echo "No assets found or token has no access to private release."
            echo "$release_json" | jq -r '.message? // empty'
            exit 1
          fi

          echo "Assets:"
          echo "$assets"

          echo "Downloading assets to $OUT_DIR ..."
          echo "$assets" | while read -r id name; do
            [ -z "${id:-}" ] && continue
            echo " - id=$id name=$name"
            curl -fL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GH_REPO}/releases/assets/${id}" \
              -o "$OUT_DIR/$name"
          done

          echo "Downloaded files (head):"
          ls -lh "$OUT_DIR" | head -n 200
          echo "Deb count:"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.deb" | wc -l

      - name: Build ISO with simple-cdd (auto fallback if --local-packages unsupported)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          echo "Using local packages dir: $LOCAL_PKGS"
          test -d "$LOCAL_PKGS"
          test -f simple-cdd.conf

          echo "=== build-simple-cdd --help (first 120 lines) ==="
          build-simple-cdd --help | head -n 120 || true

          # Đảm bảo symlink tồn tại để simple-cdd tìm theo cách mặc định
          mkdir -p extras
          ln -sfn ../build-iso/extras/local-packages extras/local-packages

          # Thử build có --local-packages trước
          set +e
          build-simple-cdd \
            --conf "$GITHUB_WORKSPACE/simple-cdd.conf" \
            --dist bookworm \
            --force-root \
            --verbose \
            --local-packages "$LOCAL_PKGS" \
            --logfile "$GITHUB_WORKSPACE/build-simple-cdd.log"
          rc=$?

          if [ $rc -ne 0 ]; then
            echo "build-simple-cdd failed (code=$rc). Show log + retry without --local-packages..."
            echo "==== tail build-simple-cdd.log ===="
            tail -n 200 "$GITHUB_WORKSPACE/build-simple-cdd.log" || true

            echo "Retry WITHOUT --local-packages (using extras/local-packages symlink)..."
            build-simple-cdd \
              --conf "$GITHUB_WORKSPACE/simple-cdd.conf" \
              --dist bookworm \
              --force-root \
              --verbose \
              --logfile "$GITHUB_WORKSPACE/build-simple-cdd.log"
            rc2=$?

            if [ $rc2 -ne 0 ]; then
              echo "Retry failed too (code=$rc2)."
              echo "==== tail build-simple-cdd.log (retry) ===="
              tail -n 200 "$GITHUB_WORKSPACE/build-simple-cdd.log" || true
              echo "==== list tmp/ (if exists) ===="
              ls -la "$GITHUB_WORKSPACE/tmp" || true
              exit $rc2
            fi
          fi
          set -e

          echo "ISO outputs:"
          ls -la images || true
          find images -maxdepth 1 -type f -name "*.iso" -print || true

      - name: Upload ISO + logs
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          if-no-files-found: error
          path: |
            images/*.iso
            build-simple-cdd.log
            simple-cdd.conf
