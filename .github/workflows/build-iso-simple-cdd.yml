- name: Build ISO with simple-cdd (debug on failure)
  shell: bash
  run: |
    set -euo pipefail
    cd "$GITHUB_WORKSPACE"

    LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
    echo "Using local packages dir: $LOCAL_PKGS"
    test -d "$LOCAL_PKGS"
    test -f simple-cdd.conf

    # In ra version/help để biết build-simple-cdd có hỗ trợ --local-packages không
    echo "=== build-simple-cdd --version ==="
    build-simple-cdd --version || true
    echo "=== build-simple-cdd --help (first 120 lines) ==="
    build-simple-cdd --help | head -n 120 || true

    # Nếu không hỗ trợ --local-packages, dùng symlink cách cổ điển để simple-cdd tự pick
    mkdir -p extras
    ln -sfn ../build-iso/extras/local-packages extras/local-packages

    set +e
    # Thử build có --local-packages trước (nếu tool hỗ trợ)
    build-simple-cdd \
      --conf "$GITHUB_WORKSPACE/simple-cdd.conf" \
      --dist bookworm \
      --force-root \
      --verbose \
      --local-packages "$LOCAL_PKGS" \
      --logfile "$GITHUB_WORKSPACE/build-simple-cdd.log"
    rc=$?

    if [ $rc -ne 0 ]; then
      echo "build-simple-cdd failed with code=$rc"
      echo "==== tail build-simple-cdd.log ===="
      tail -n 200 "$GITHUB_WORKSPACE/build-simple-cdd.log" || true
      echo "==== list tmp/ ===="
      ls -la "$GITHUB_WORKSPACE/tmp" || true
      echo "==== tail any tmp logs ===="
      find "$GITHUB_WORKSPACE/tmp" -maxdepth 2 -type f -name "*.log" -print -exec tail -n 80 {} \; || true

      echo "Retry WITHOUT --local-packages (using extras/local-packages symlink)..."
      build-simple-cdd \
        --conf "$GITHUB_WORKSPACE/simple-cdd.conf" \
        --dist bookworm \
        --force-root \
        --verbose \
        --logfile "$GITHUB_WORKSPACE/build-simple-cdd.log"
      rc2=$?

      if [ $rc2 -ne 0 ]; then
        echo "Retry also failed with code=$rc2"
        echo "==== tail build-simple-cdd.log (retry) ===="
        tail -n 200 "$GITHUB_WORKSPACE/build-simple-cdd.log" || true
        exit $rc2
      fi
    fi

    set -e
    echo "ISO outputs:"
    ls -la images || true
    find images -maxdepth 1 -type f -name "*.iso" -print || true
