name: Build ISO with simple-cdd (download release debs + local-packages)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install tools (simple-cdd + curl + jq)
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl jq gnupg \
            simple-cdd debian-cd xorriso genisoimage isolinux syslinux-common

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets into build-iso/extras/local-packages
        env:
          GH_REPO: ThuongPhan662003/Build
          GH_TAG: deb-v0.0.1
          TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          OUT_DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          mkdir -p "$OUT_DIR"

          echo "Fetching release info: $GH_REPO tag=$GH_TAG"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/${GH_TAG}")"

          assets="$(echo "$release_json" | jq -r '.assets[] | "\(.id) \(.name)"')"

          if [ -z "$assets" ]; then
            echo "No assets found or token has no access."
            echo "$release_json" | jq -r '.message? // empty'
            exit 1
          fi

          echo "Downloading assets to $OUT_DIR ..."
          echo "$assets" | while read -r id name; do
            [ -z "$id" ] && continue
            echo " - id=$id name=$name"
            curl -fL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GH_REPO}/releases/assets/${id}" \
              -o "$OUT_DIR/$name"
          done

          echo "Local-packages after download:"
          ls -lh "$OUT_DIR" | head -n 200
          echo "Deb count:"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.deb" | wc -l

      - name: Build ISO with simple-cdd (use --local-packages)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          echo "Using local packages dir: $LOCAL_PKGS"
          test -d "$LOCAL_PKGS"
          test -f simple-cdd.conf

          build-simple-cdd \
            --conf "$GITHUB_WORKSPACE/simple-cdd.conf" \
            --dist bookworm \
            --force-root \
            --verbose \
            --local-packages "$LOCAL_PKGS" \
            --logfile "$GITHUB_WORKSPACE/build-simple-cdd.log"

          echo "ISO outputs:"
          ls -la images || true
          find images -maxdepth 1 -type f -name "*.iso" -print || true

      - name: Upload ISO + logs
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          if-no-files-found: error
          path: |
            images/*.iso
            build-simple-cdd.log
            simple-cdd.conf
