name: Download .deb packages into repo (PG12 + PHP 7.2 + NGINX)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  download_and_commit:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Install git + tools
        run: |
          set -e
          apt-get update
          apt-get install -y git ca-certificates curl gnupg

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add repos and download .deb into repo folder
        run: |
          set -e

          OUT_DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR"

          # -----------------------
          # 1) PGDG repo (PostgreSQL)
          # -----------------------
          install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          chmod 0644 /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt bookworm-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list

          # -----------------------
          # 2) Sury repo (PHP)
          # -----------------------
          curl -fsSL https://packages.sury.org/php/apt.gpg \
            | gpg --dearmor -o /usr/share/keyrings/debsuryorg-archive-keyring.gpg
          chmod 0644 /usr/share/keyrings/debsuryorg-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ bookworm main" \
            > /etc/apt/sources.list.d/sury-php.list

          # -----------------------
          # 3) NGINX repo (mainline)
          # -----------------------
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          chmod 0644 /usr/share/keyrings/nginx-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/mainline/debian/ bookworm nginx" \
            > /etc/apt/sources.list.d/nginx.list

          # Update after adding repos
          apt-get update

          # -----------------------
          # Download PostgreSQL 12
          # -----------------------
          apt-get -y --download-only \
            -o Dir::Cache::archives="$OUT_DIR" \
            install \
            postgresql-12 postgresql-client-12 postgresql-contrib-12

          # -----------------------
          # Download PHP 7.2 (Sury)
          # -----------------------
          apt-get -y --download-only \
            -o Dir::Cache::archives="$OUT_DIR" \
            install \
            php7.2-cli php7.2-fpm php7.2-curl php7.2-mysql php7.2 php7.2-odbc \
            php7.2-imap php7.2-gd php7.2-xml php7.2-dev php7.2-pgsql \
            php7.2-sqlite3-dbgsym php7.2-sqlite3

          # -----------------------
          # Download NGINX
          # -----------------------
          apt-get -y --download-only \
            -o Dir::Cache::archives="$OUT_DIR" \
            install nginx

          echo "Downloaded .deb files:"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.deb" -print | head -n 200
          echo "Count:"
          find "$OUT_DIR" -maxdepth 1 -type f -name "*.deb" | wc -l

      - name: Commit and push to repo (force add if ignored)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # force add in case repo ignores build-iso or *.deb
          git add -f build-iso/extras/local-packages || true

          if git status --porcelain | grep -q .; then
            git commit -m "Add deb packages: PG12 + PHP 7.2 + NGINX (bookworm)"
            git push
          else
            echo "No changes to commit."
          fi
