name: Build ISO (simple-cdd) + Download .deb from GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (vd: deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      LOCAL_DEB_DIR: build-iso/extras/local-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (curl, jq, simple-cdd + GPG keyrings)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl jq grep sed \
            gnupg gpgv debian-archive-keyring \
            simple-cdd python3-simple-cdd \
            debian-cd reprepro xorriso isolinux syslinux-common mtools \
            dctrl-tools dose-distcheck hfsutils lynx

          # kiểm tra keyring đã có chưa
          ls -la /usr/share/keyrings/ | head -n 50
          test -f /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Prepare GNUPG home for runner (fix random_seed error)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          # tạo file random_seed nếu cần (không bắt buộc nhưng giúp tránh lỗi)
          touch "$HOME/.gnupg/random_seed" || true

      - name: Download .deb assets from GitHub Release (no token)
        shell: bash
        run: |
          set -euo pipefail

          OWNER_REPO="${GITHUB_REPOSITORY}"
          TAG="${{ inputs.release_tag }}"
          API="https://api.github.com/repos/${OWNER_REPO}/releases/tags/${TAG}"

          echo "Using release: ${OWNER_REPO} tag=${TAG}"
          mkdir -p "${LOCAL_DEB_DIR}"

          release_json="$(curl -fsSL -H "Accept: application/vnd.github+json" "$API")"

          mapfile -t urls < <(
            echo "$release_json" \
              | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url'
          )

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "ERROR: No .deb assets found in release tag ${TAG}"
            exit 1
          fi

          echo "Found ${#urls[@]} .deb assets. Downloading..."
          for u in "${urls[@]}"; do
            echo "-> $u"
            curl -fL --retry 5 --retry-delay 2 -o "${LOCAL_DEB_DIR}/$(basename "$u")" "$u"
          done

          echo "Downloaded files:"
          ls -lh "${LOCAL_DEB_DIR}"

      - name: Build ISO with simple-cdd (non-root)
        shell: bash
        env:
          GNUPGHOME: ${{ github.workspace }}/.gnupg-ci
        run: |
          set -euo pipefail

          # Dùng GNUPGHOME riêng trong workspace cho chắc quyền ghi
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          test -f "$CONF" || (echo "Missing $CONF" && exit 1)

          # đảm bảo runner có quyền ghi trong build-iso
          sudo chown -R "$USER":"$USER" "$GITHUB_WORKSPACE/build-iso"

          cd "$GITHUB_WORKSPACE/build-iso"

          simple-cdd --conf ./simple-cdd.conf 2>&1 | tee "$GITHUB_WORKSPACE/build-simple-cdd.log"

          cd "$GITHUB_WORKSPACE"
          mkdir -p out

          ISO_PATH="$(find "$GITHUB_WORKSPACE/build-iso" -maxdepth 6 -type f -name "*.iso" | head -n 1 || true)"
          if [ -z "$ISO_PATH" ]; then
            echo "ERROR: No ISO produced. Check build-simple-cdd.log"
            exit 1
          fi

          cp -v "$ISO_PATH" out/
          ls -lh out/*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: out/*.iso

      - name: Upload downloaded debs artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-assets
          path: ${{ env.LOCAL_DEB_DIR }}/*.deb

      - name: Upload build log artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-simple-cdd.log
