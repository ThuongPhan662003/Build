name: Build ISO (simple-cdd)

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    env:
      RELEASE_PAGE: "https://github.com/ThuongPhan662003/Build/releases/tag/deb-v0.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO (download assets from release page -> local-packages -> build-simple-cdd)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOG="$GITHUB_WORKSPACE/build-simple-cdd.log"

          trap 'rc=$?;
            echo "FAILED at line $LINENO: $BASH_COMMAND (exit=$rc)";
            echo "=== PWD ==="; pwd;
            echo "=== ls -la (root) ==="; ls -la;
            echo "=== ls -la build-iso ==="; ls -la build-iso || true;
            echo "=== ls -la build-iso/extras ==="; ls -la build-iso/extras || true;
            echo "=== ls -la local-packages ==="; ls -la "$LOCAL_PKGS" || true;
            echo "=== tail build-simple-cdd.log ==="; tail -n 200 "$LOG" 2>/dev/null || echo "(no build-simple-cdd.log)";
            exit $rc
          ' ERR

          echo "Using local packages dir: $LOCAL_PKGS"
          mkdir -p "$LOCAL_PKGS"

          sudo apt-get update -y
          sudo apt-get install -y curl grep sed simple-cdd

          # Verify conf exists
          test -f "$CONF"

          echo "Fetching release page: $RELEASE_PAGE"
          html="$(curl -fsSL "$RELEASE_PAGE")"

          # Lấy các link download asset trực tiếp từ HTML (ưu tiên .deb)
          # Ví dụ link dạng: /ThuongPhan662003/Build/releases/download/deb-v0.0.1/abc.deb
          mapfile -t urls < <(echo "$html" \
            | grep -oE '/ThuongPhan662003/Build/releases/download/[^"]+\.deb' \
            | sed 's#^#https://github.com#' \
            | sort -u)

          if [[ ${#urls[@]} -eq 0 ]]; then
            echo "ERROR: Không tìm thấy asset .deb trên trang release."
            echo "Gợi ý: kiểm tra release có upload file .deb chưa."
            exit 1
          fi

          echo "Found ${#urls[@]} .deb assets:"
          printf ' - %s\n' "${urls[@]}"

          echo "Downloading assets to $LOCAL_PKGS"
          for u in "${urls[@]}"; do
            echo " - $u"
            curl -fL -o "$LOCAL_PKGS/$(basename "$u")" "$u"
          done

          echo "Downloaded files:"
          ls -lh "$LOCAL_PKGS"

          # Build ISO
          build-simple-cdd \
            --conf "$CONF" \
            --dist bookworm \
            --force-root \
            --verbose \
            --local-packages "$LOCAL_PKGS" \
            --logfile "$LOG"

          echo "ISO outputs:"
          ls -la images || true
          find images -maxdepth 1 -type f -name "*.iso" -print || true

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            images/*.iso
            build-simple-cdd.log
