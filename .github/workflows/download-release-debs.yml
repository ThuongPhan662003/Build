name: Download .deb from Release to local-packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to download (e.g., deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Download .deb assets from release tag into build-iso/extras/local-packages
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"
          OWNER_REPO="${GITHUB_REPOSITORY}"   # e.g. ThuongPhan662003/Build
          OUT_DIR="build-iso/extras/local-packages"

          mkdir -p "$OUT_DIR"
          echo "Downloading .deb assets from tag: $TAG"
          echo "Output dir: $OUT_DIR"

          API="https://api.github.com/repos/${OWNER_REPO}/releases/tags/${TAG}"

          # Lấy danh sách link download của assets .deb
          mapfile -t URLS < <(
            curl -fsSL -H "Accept: application/vnd.github+json" "$API" \
            | jq -r '.assets[] | select(.name|endswith(".deb")) | .browser_download_url'
          )

          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "No .deb assets found in release tag $TAG"
            exit 1
          fi

          for url in "${URLS[@]}"; do
            fname="$(basename "$url")"
            echo "-> $fname"
            curl -fL --retry 5 --retry-delay 2 -o "$OUT_DIR/$fname" "$url"
          done

          echo "Done. Files in $OUT_DIR:"
          ls -lah "$OUT_DIR"

      - name: Upload downloaded folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-packages-${{ inputs.release_tag }}
          path: build-iso/extras/local-packages
