name: Download deb assets from Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

jobs:
  download:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Download .deb assets to build-iso/extras/local-packages
        env:
          OWNER: ThuongPhan662003
          REPO: Build
          TAG: ${{ inputs.tag }}
          OUT_DIR: build-iso/extras/local-packages
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          api="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}"
          echo "Fetching release JSON: $api"
          json="$(curl -fsSL -H "Accept: application/vnd.github+json" "$api")"

          urls="$(echo "$json" | jq -r '.assets[] | select(.name|endswith(".deb")) | .browser_download_url')"

          if [ -z "${urls}" ]; then
            echo "No .deb assets found in release tag ${TAG}"
            exit 1
          fi

          echo "Downloading these .deb assets:"
          echo "$urls"

          while IFS= read -r u; do
            [ -n "$u" ] || continue
            echo "-> $u"
            curl -fL --retry 5 --retry-delay 2 -o "${OUT_DIR}/$(basename "$u")" "$u"
          done <<< "$urls"

          echo "=== Downloaded files ==="
          ls -lah "$OUT_DIR"

      - name: Upload as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: local-packages-${{ inputs.tag }}
          path: build-iso/extras/local-packages/*.deb
          if-no-files-found: error
