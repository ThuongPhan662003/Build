name: Download Release .deb to local-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ví dụ: deb-v0.0.1). Để trống = lấy latest release"
        required: false
        default: ""

jobs:
  download:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq

      - name: Download .deb assets from Release
        shell: bash
        env:
          OWNER: ThuongPhan662003
          REPO: Build
          TAG: ${{ inputs.tag }}
          # Dùng GITHUB_TOKEN mặc định (không cần PAT riêng)
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ github.workspace }}/build-iso/extras/local-packages
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          if [ -n "${TAG}" ]; then
            api="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}"
            echo "Fetching release by tag: ${TAG}"
          else
            api="https://api.github.com/repos/${OWNER}/${REPO}/releases/latest"
            echo "Fetching latest release"
          fi

          release_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"

          echo "Release: $(echo "$release_json" | jq -r '.name // .tag_name')"

          mapfile -t urls < <(echo "$release_json" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url')

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No .deb assets found in this release."
            exit 1
          fi

          echo "Found ${#urls[@]} .deb files. Downloading to: $OUT_DIR"
          for u in "${urls[@]}"; do
            fname="$(basename "$u")"
            echo "-> $fname"
            curl -fL --retry 5 --retry-delay 2 -o "$OUT_DIR/$fname" "$u"
          done

          echo "Downloaded files:"
          ls -lh "$OUT_DIR"

      - name: Upload local-packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-packages
          path: build-iso/extras/local-packages/*.deb
          if-no-files-found: error
