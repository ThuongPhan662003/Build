name: Sync release .deb to repo local-packages (Git LFS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
          lfs: true

      - name: Install tools (curl/jq/git-lfs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq git-lfs
          git lfs install

      - name: Ensure Git LFS tracks deb packages
        run: |
          set -euo pipefail
          # Track only debs in this folder to avoid LFS for other files
          git lfs track "build-iso/extras/local-packages/*.deb"
          # Ensure .gitattributes is included
          git add .gitattributes || true

      - name: Download .deb assets from release to build-iso/extras/local-packages
        env:
          OWNER: ThuongPhan662003
          REPO: Build
          TAG: ${{ inputs.tag }}
          OUT_DIR: build-iso/extras/local-packages
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          api="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}"
          echo "Fetching: $api"

          json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$api")"

          urls="$(echo "$json" | jq -r '.assets[] | select(.name|endswith(".deb")) | .browser_download_url')"
          if [ -z "$urls" ]; then
            echo "ERROR: Release $TAG không có asset .deb"
            echo "$json" | jq -r '.assets[]?.name'
            exit 1
          fi

          while IFS= read -r u; do
            [ -n "$u" ] || continue
            f="${OUT_DIR}/$(basename "$u")"
            echo "Downloading: $u -> $f"
            curl -fL --retry 5 --retry-delay 2 -o "$f" "$u"
          done <<< "$urls"

          echo "== Files downloaded =="
          ls -lah "$OUT_DIR"

      - name: Commit and push to repo (LFS)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add debs (will be stored as LFS pointers because of tracking)
          git add build-iso/extras/local-packages/*.deb || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync .deb assets from release ${{ inputs.tag }} (LFS)"
          git push

      - name: Debug LFS status (optional)
        if: always()
        run: |
          git lfs ls-files || true
