name: Build ISO (minimal)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install simple-cdd and minimal deps
        run: |
          set -euo pipefail
          apt-get update
          # simple-cdd + vài gói hay thiếu trong image minimal
          apt-get install -y --no-install-recommends \
            simple-cdd ca-certificates gnupg dirmngr \
            distro-info-data xorriso isolinux syslinux-common
          update-ca-certificates

      - name: Build ISO (non-root, with local-packages)
        run: |
          set -euo pipefail

          # tạo user build
          useradd -m -s /bin/bash builder || true
          mkdir -p /home/builder/.gnupg
          chown -R builder:builder /home/builder

          # đảm bảo workspace thuộc quyền builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # đường dẫn thật
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"

          # kiểm tra tồn tại để fail rõ ràng
          test -f "$CONF"
          mkdir -p "$LOCAL_PKGS"

          echo "CONF=$CONF"
          echo "LOCAL_PKGS=$LOCAL_PKGS"
          ls -lah "$LOCAL_PKGS" || true

          # chạy build bằng builder (quan trọng)
          su - builder -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            build-simple-cdd --conf '$CONF' --dvd --local-packages '$LOCAL_PKGS'
          "

      - name: Collect ISO files
        run: |
          set -euo pipefail
          ls -lah build-iso || true
          find build-iso -maxdepth 4 -type f -name '*.iso' -print -exec ls -lh {} \;

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
          if-no-files-found: error
