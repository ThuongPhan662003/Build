name: Build ISO (minimal)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install simple-cdd and minimal deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y simple-cdd 

      - name: Build (non-root)
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          build-simple-cdd --conf '$CONF' --dvd --local-packages '$LOCAL_PKGS'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: build-iso/**/*.iso
          if-no-files-found: error
