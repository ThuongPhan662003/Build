name: Build ISO (simple-cdd, non-root)

on:
  workflow_dispatch:

env:
  # bật debug log chi tiết
  ACTIONS_STEP_DEBUG: "true"
  ACTIONS_RUNNER_DEBUG: "true"

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      # 1) Checkout bình thường (KHÔNG bật lfs ở đây để tránh fail ngay)
      - name: Checkout repo (no LFS at checkout)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # 2) Cài tool cần thiết để kéo LFS và debug
      - name: Install required tools (git + git-lfs + debug utils)
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates \
            coreutils findutils sed gawk

          git --version
          git lfs version

      # 3) Kéo LFS objects thật về (đây là bước quyết định)
      - name: Pull Git LFS objects
        run: |
          set -euxo pipefail
          git lfs install --local
          git lfs env || true
          git lfs ls-files || true
          git lfs pull

      # 4) Kiểm tra local-packages có còn pointer không + in log rõ ràng
      - name: Diagnose local-packages (show errors clearly)
        run: |
          set -euxo pipefail
          DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          echo "DIR=$DIR"
          ls -lah "$DIR" | sed -n '1,80p'

          echo "=== Check for LFS pointer files ==="
          bad=0
          while IFS= read -r -d '' f; do
            head1="$(head -n 1 "$f" || true)"
            if [[ "$head1" == "version https://git-lfs.github.com/spec/v1" ]]; then
              echo "LFS_POINTER: $(basename "$f")"
              echo "--- first 5 lines ---"
              sed -n '1,5p' "$f" || true
              echo "---------------------"
              bad=1
            fi
          done < <(find "$DIR" -maxdepth 1 -type f -name "*.deb" -print0)

          if [ "$bad" -ne 0 ]; then
            echo "ERROR: Found LFS pointer files in local-packages. LFS pull didn't fetch real binaries."
            exit 1
          fi

          echo "=== Check .deb ar header '!<arch>' ==="
          bad2=0
          for f in "$DIR"/*.deb; do
            sig="$(head -c 7 "$f" || true)"
            if [ "$sig" != "!<arch>" ]; then
              echo "BAD_DEB: $(basename "$f") sig='$sig' size=$(stat -c%s "$f" || true)"
              echo "--- first 20 lines ---"
              sed -n '1,20p' "$f" || true
              echo "----------------------"
              bad2=1
            fi
          done

          if [ "$bad2" -ne 0 ]; then
            echo "ERROR: Some .deb files are not valid ar archives."
            exit 1
          fi
          echo "OK: local-packages are valid."

      # 5) Cài simple-cdd (bạn nói đừng làm bước 1 tải deb; cái này chỉ cài tool build)
      - name: Install simple-cdd
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends simple-cdd

      # 6) Build non-root và tee log để bạn nhìn được lỗi
      - name: Build ISO (non-root)
        run: |
          set -euxo pipefail

          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          su - builder -c "
            set -euxo pipefail
            build-simple-cdd --conf \"$CONF\" --dvd --local-packages \"$LOCAL_PKGS\" 2>&1 | tee \"$GITHUB_WORKSPACE/build-iso/build.log\"
          "

      # 7) Luôn in tail log khi fail để bạn thấy lỗi
      - name: Show tail build log (always)
        if: always()
        run: |
          set -euxo pipefail
          echo '=== Tail build.log ==='
          tail -n 250 "$GITHUB_WORKSPACE/build-iso/build.log" || true
          echo '=== ISO files ==='
          find "$GITHUB_WORKSPACE/build-iso" -type f -name "*.iso" -print || true

      - name: Upload ISO + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
            build-iso/build.log
          if-no-files-found: warn
