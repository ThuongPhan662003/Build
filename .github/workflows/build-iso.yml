name: Build ISO (simple-cdd, non-root)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      # 0) Cài tools TRƯỚC khi checkout để actions/checkout dùng git clone => có .git
      - name: Install git + git-lfs + debug tools (BEFORE checkout)
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git git-lfs file coreutils findutils sed gawk
          git --version
          git lfs version
          file --version | head -n 1

      # 1) Checkout bằng git (có .git) + kéo LFS
      - name: Checkout repo (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2) Log rõ để bạn thấy chắc chắn có .git
      - name: Show workspace + verify .git
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -lah "$GITHUB_WORKSPACE" | sed -n '1,80p'
          test -d "$GITHUB_WORKSPACE/.git"
          cd "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
          git status --porcelain || true

      # 3) Bảo đảm LFS objects đã về đủ (đề phòng checkout lfs chưa kéo hết)
      - name: Ensure LFS objects are present (force pull)
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          git lfs install --local
          git lfs pull
          git lfs ls-files | head -n 50 || true

      # 4) Diagnose local-packages: bắt lỗi LFS pointer / file hỏng và IN RA LOG
      - name: Diagnose local-packages (show errors clearly)
        run: |
          set -euxo pipefail
          DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          echo "DIR=$DIR"
          ls -lah "$DIR" | sed -n '1,60p' || true

          echo "=== Check for LFS pointer files (must NOT start with 'version https://git-lfs...') ==="
          bad=0
          while IFS= read -r -d '' f; do
            head1="$(head -n 1 "$f" || true)"
            if [[ "$head1" == "version https://git-lfs.github.com/spec/v1" ]]; then
              echo "BAD (LFS POINTER): $(basename "$f")"
              echo "---- first lines ----"
              sed -n '1,5p' "$f" || true
              echo "---------------------"
              bad=1
            fi
          done < <(find "$DIR" -maxdepth 1 -type f -name "*.deb" -print0)

          echo "=== Check .deb ar header '!<arch>' ==="
          bad2=0
          for f in "$DIR"/*.deb; do
            sig="$(head -c 7 "$f" || true)"
            if [ "$sig" != "!<arch>" ]; then
              echo "BAD (NOT A REAL DEB): $(basename "$f") sig='$sig' size=$(stat -c%s "$f" || true)"
              echo "---- first 20 lines ----"
              sed -n '1,20p' "$f" || true
              echo "------------------------"
              bad2=1
            fi
          done

          if [ "$bad" -ne 0 ] || [ "$bad2" -ne 0 ]; then
            echo "ERROR: local-packages contains invalid .deb (LFS pointers or corrupted downloads)."
            exit 1
          fi

          echo "OK: local-packages are valid deb archives."

      # 5) Cài simple-cdd
      - name: Install simple-cdd
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends simple-cdd reprepro

      # 6) Build ISO non-root
      - name: Build ISO (non-root)
        run: |
          set -euxo pipefail
          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          su - builder -c "
            set -euxo pipefail
            build-simple-cdd --conf \"$CONF\" --dvd --local-packages \"$LOCAL_PKGS\" \
              2>&1 | tee \"$GITHUB_WORKSPACE/build-iso/build.log\"
          "

      # 7) Luôn show log cuối để bạn thấy lỗi gì nếu fail
      - name: Show tail build log (always)
        if: always()
        run: |
          set -euxo pipefail
          echo '=== Tail build.log ==='
          tail -n 250 "$GITHUB_WORKSPACE/build-iso/build.log" || true
          echo '=== ISO files ==='
          find "$GITHUB_WORKSPACE/build-iso" -type f -name "*.iso" -print || true

      - name: Upload ISO + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
            build-iso/build.log
          if-no-files-found: warn
