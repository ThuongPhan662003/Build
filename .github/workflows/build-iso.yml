name: Build ISO (simple-cdd)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install simple-cdd
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y simple-cdd xorriso rsync ca-certificates

      - name: Build ISO (with local-packages)
        run: |
          set -euo pipefail

          # thư mục chứa local-packages trong repo
          LOCAL_PKGS="$(pwd)/build-iso/extras/local-packages"
          echo "Using local packages dir: $LOCAL_PKGS"
          ls -lah "$LOCAL_PKGS" || true

          # build-simple-cdd chạy trong thư mục build-iso (nơi có simple-cdd.conf)
          cd build-iso

          # Gắn đường dẫn local-packages vào build
          # (simple-cdd sẽ dùng packages này làm nguồn bổ sung)
          build-simple-cdd --verbose --local-packages "$LOCAL_PKGS"

          echo "=== ISO outputs ==="
          find . -type f -name "*.iso" -print -exec ls -lah {} \;

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: build-iso/**/*.iso
          if-no-files-found: error
