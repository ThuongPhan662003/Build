name: Build ISO (simple-cdd, non-root)

on:
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: "true"
  ACTIONS_RUNNER_DEBUG: "true"

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo (no LFS at checkout)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # ✅ NEW: log vị trí + xác nhận có .git
      - name: Show workspace + git status
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -lah "$GITHUB_WORKSPACE" | sed -n '1,120p' || true
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            echo "OK: .git exists"
          else
            echo "ERROR: .git NOT found in GITHUB_WORKSPACE"
            echo "Find any .git:"
            find / -maxdepth 4 -type d -name .git 2>/dev/null | head -n 20 || true
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree
          git status --porcelain || true

      - name: Install required tools (git + git-lfs + debug utils)
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates \
            coreutils findutils sed gawk

          git --version
          git lfs version

      # ✅ FIX: luôn cd vào workspace trước khi chạy git lfs
      - name: Pull Git LFS objects
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          pwd
          git rev-parse --is-inside-work-tree
          git lfs install --local
          git lfs env || true
          git lfs ls-files || true
          git lfs pull

      - name: Diagnose local-packages (show errors clearly)
        run: |
          set -euxo pipefail
          DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          echo "DIR=$DIR"
          ls -lah "$DIR" | sed -n '1,80p' || true

          echo "=== Check for LFS pointer files ==="
          bad=0
          while IFS= read -r -d '' f; do
            head1="$(head -n 1 "$f" || true)"
            if [[ "$head1" == "version https://git-lfs.github.com/spec/v1" ]]; then
              echo "LFS_POINTER: $(basename "$f")"
              sed -n '1,5p' "$f" || true
              bad=1
            fi
          done < <(find "$DIR" -maxdepth 1 -type f -name "*.deb" -print0)

          if [ "$bad" -ne 0 ]; then
            echo "ERROR: Found LFS pointer files in local-packages."
            exit 1
          fi

          echo "=== Check .deb ar header '!<arch>' ==="
          bad2=0
          for f in "$DIR"/*.deb; do
            sig="$(head -c 7 "$f" || true)"
            if [ "$sig" != "!<arch>" ]; then
              echo "BAD_DEB: $(basename "$f") sig='$sig' size=$(stat -c%s "$f" || true)"
              sed -n '1,20p' "$f" || true
              bad2=1
            fi
          done
          if [ "$bad2" -ne 0 ]; then
            echo "ERROR: Some .deb files are not valid ar archives."
            exit 1
          fi
          echo "OK: local-packages are valid."

      - name: Install simple-cdd
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends simple-cdd

      - name: Build ISO (non-root)
        run: |
          set -euxo pipefail

          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          su - builder -c "
            set -euxo pipefail
            build-simple-cdd --conf \"$CONF\" --dvd --local-packages \"$LOCAL_PKGS\" 2>&1 | tee \"$GITHUB_WORKSPACE/build-iso/build.log\"
          "

      - name: Show tail build log (always)
        if: always()
        run: |
          set -euxo pipefail
          echo '=== Tail build.log ==='
          tail -n 250 "$GITHUB_WORKSPACE/build-iso/build.log" || true
          echo '=== ISO files ==='
          find "$GITHUB_WORKSPACE/build-iso" -type f -name "*.iso" -print || true

      - name: Upload ISO + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
            build-iso/build.log
          if-no-files-found: warn
