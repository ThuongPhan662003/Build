name: Build ISO (minimal)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install simple-cdd and deps
        run: |
          set -euo pipefail
          apt-get update
          # thêm vài gói hay thiếu trong image minimal
          apt-get install -y --no-install-recommends \
            simple-cdd ca-certificates gnupg dirmngr distro-info-data \
            xorriso isolinux syslinux-common
          update-ca-certificates

      - name: Build (non-root)
        run: |
          set -euo pipefail

          # paths
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"

          # ensure exist
          test -f "$CONF"
          mkdir -p "$LOCAL_PKGS"

          # create non-root user
          useradd -m -s /bin/bash builder || true
          mkdir -p /home/builder/.gnupg
          chown -R builder:builder /home/builder

          # make builder own the workspace
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # run build as builder
          su - builder -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            build-simple-cdd --conf '$CONF' --dvd --local-packages '$LOCAL_PKGS'
          "

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
          if-no-files-found: error
