name: Build ISO (simple-cdd, non-root)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo (with LFS)
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      # Bạn nói "đã làm bước 1 rồi" => mình không lặp lại step tải deb.
      # Mình chỉ đảm bảo action lấy được file LFS thật, không phải pointer.

      - name: Install required tools (git-lfs + deps for debug/build)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            simple-cdd git-lfs ca-certificates coreutils findutils sed gawk

          git lfs version || true

      - name: Ensure LFS objects are present (force pull)
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

      - name: Diagnose local-packages (fail fast if LFS pointer)
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE/build-iso/extras/local-packages"
          echo "DIR=$DIR"
          ls -lah "$DIR" | sed -n '1,120p'

          echo
          echo "=== Check for LFS pointer files ==="
          # nếu file bắt đầu bằng "version https://git-lfs.github.com/spec/v1" -> vẫn là pointer
          bad=0
          while IFS= read -r -d '' f; do
            head1="$(head -n 1 "$f" || true)"
            if [[ "$head1" == "version https://git-lfs.github.com/spec/v1" ]]; then
              echo "LFS_POINTER: $(basename "$f")"
              sed -n '1,3p' "$f" || true
              bad=1
            fi
          done < <(find "$DIR" -maxdepth 1 -type f -name "*.deb" -print0)

          if [ "$bad" -ne 0 ]; then
            echo
            echo "ERROR: local-packages contains Git LFS pointer files, not real .deb binaries."
            echo "Fix: ensure LFS objects are pushed and pulled. (git lfs ls-files; git lfs pull)"
            exit 1
          fi

          echo
          echo "=== Check .deb ar header '!<arch>' ==="
          bad2=0
          for f in "$DIR"/*.deb; do
            sig="$(head -c 7 "$f" || true)"
            if [ "$sig" != "!<arch>" ]; then
              echo "BAD_DEB: $(basename "$f") sig='$sig' size=$(stat -c%s "$f" || true)"
              bad2=1
            fi
          done
          if [ "$bad2" -ne 0 ]; then
            echo "ERROR: Found invalid .deb (not ar archives)."
            exit 1
          fi
          echo "OK: local-packages look valid."

      - name: Build ISO (non-root, using existing local-packages)
        run: |
          set -euo pipefail

          # tạo user build
          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          echo "CONF=$CONF"
          echo "LOCAL_PKGS=$LOCAL_PKGS"

          # chạy build bằng user builder
          su - builder -c "
            set -euo pipefail
            build-simple-cdd --conf \"$CONF\" --dvd --local-packages \"$LOCAL_PKGS\" 2>&1 | tee \"$GITHUB_WORKSPACE/build-iso/build.log\"
          "

      - name: Collect build logs (always)
        if: always()
        run: |
          set -euo pipefail
          echo "=== Tail build log ==="
          tail -n 200 "$GITHUB_WORKSPACE/build-iso/build.log" || true
          echo "=== Find ISO files ==="
          find "$GITHUB_WORKSPACE/build-iso" -maxdepth 4 -type f \( -name "*.iso" -o -name "*.log" \) -print || true

      - name: Upload ISO + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            build-iso/**/*.iso
            build-iso/build.log
          if-no-files-found: warn
