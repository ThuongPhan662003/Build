name: Build ISO (simple-cdd only)

on:
  workflow_dispatch:

jobs:
  build_iso:
    runs-on: ubuntu-latest

    container:
      image: debian:bookworm

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install simple-cdd + required deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            simple-cdd reprepro xorriso \
            ca-certificates \
            gnupg gpgv \
            debian-archive-keyring
          update-ca-certificates || true

      - name: Build ISO (non-root) using existing local-packages
        run: |
          set -euo pipefail

          # Paths
          CONF="$GITHUB_WORKSPACE/build-iso/simple-cdd.conf"
          LOCAL_PKGS="$GITHUB_WORKSPACE/build-iso/extras/local-packages"

          echo "CONF=$CONF"
          echo "LOCAL_PKGS=$LOCAL_PKGS"

          # Validate inputs exist
          test -f "$CONF"
          test -d "$LOCAL_PKGS"
          ls -lah "$LOCAL_PKGS" | head -n 50

          # Create non-root builder and fix perms
          useradd -m -s /bin/bash builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -m 700 -o builder -g builder /home/builder/.gnupg

          # Run build-simple-cdd as builder
          su - builder -c "
            set -euo pipefail
            export HOME=/home/builder
            export GNUPGHOME=/home/builder/.gnupg
            chmod 700 \"\$GNUPGHOME\" || true

            cd \"$GITHUB_WORKSPACE\"
            build-simple-cdd --conf \"$CONF\" --dvd --local-packages \"$LOCAL_PKGS\"
          "

      - name: Show ISO outputs
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -type f -name "*.iso" -print -exec ls -lh {} \;
          find "$GITHUB_WORKSPACE" -type f -name "*.iso" | grep -q .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso-output
          path: |
            **/*.iso
          if-no-files-found: error
