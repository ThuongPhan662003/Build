name: Build Debian 12 ISO (simple-cdd)

on:
  push:
    tags:
      - "iso-v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "simple-cdd profile name"
        required: true
        default: "webstack"
      dist:
        description: "Debian codename"
        required: true
        default: "bookworm"
      run_qemu_smoketest:
        description: "Run qemu smoke test (best-effort)"
        required: false
        default: "false"

env:
  WORKDIR: build-iso
  PROFILE: ${{ inputs.profile || 'webstack' }}
  DIST: ${{ inputs.dist || 'bookworm' }}

jobs:
  # 1) Checkout on host runner (has git), then pack source as artifact
  prepare-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (host)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Optional: show that LFS objects are real binaries, not pointers
      - name: Quick LFS sanity check
        shell: bash
        run: |
          set -euxo pipefail
          LP="build-iso/extras/local-packages"

          if [ -d "$LP" ]; then
            echo "Found $LP"
            # in 20 file đầu (không dùng pipe head để tránh broken pipe)
            i=0
            for f in "$LP"/*.deb; do
              [ -e "$f" ] || break
              echo "$f"
              i=$((i+1))
              [ "$i" -ge 20 ] && break
            done

            # lấy 1 file đầu tiên theo glob (không pipe)
            f=""
            for x in "$LP"/*.deb; do
              [ -e "$x" ] || break
              f="$x"
              break
            done

            if [ -n "$f" ]; then
              echo "Sample deb: $f"
              # đọc 1 dòng đầu để phát hiện LFS pointer (nếu là text)
              head -n 1 "$f" || true
            else
              echo "No .deb files found in $LP"
            fi
          else
            echo "No $LP directory"
          fi

      - name: Pack repo source (exclude .git)
        shell: bash
        run: |
          set -euxo pipefail
          tar --exclude=.git -czf source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-source
          path: source.tgz
          if-no-files-found: error

  # 2) Build inside container, using the source artifact
  build-iso:
    needs: prepare-source
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container:
      image: debian:12
      options: --privileged

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: repo-source

      - name: Extract source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /work
          tar -xzf source.tgz -C /work
          ls -la /work | head -n 50

      - name: Install build dependencies (in container)
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            simple-cdd \
            debian-cd \
            xorriso \
            isolinux \
            syslinux-utils \
            rsync \
            wget \
            ca-certificates \
            apt-utils \
            gnupg \
            dosfstools \
            mtools \
            zstd \
            distro-info-data \
            qemu-system-x86 \
            qemu-utils \
            binutils \
            dpkg-dev
          rm -rf /var/lib/apt/lists/*

      - name: Show tool versions
        shell: bash
        run: |
          set -eux
          echo "WORKDIR=${WORKDIR} PROFILE=${PROFILE} DIST=${DIST}"
          build-simple-cdd --help | head -n 80 || true
          dpkg -l | egrep 'simple-cdd|debian-cd|xorriso|distro-info-data' || true

      - name: Validate profile files exist
        shell: bash
        run: |
          set -euxo pipefail
          cd /work
          echo "Using WORKDIR=${WORKDIR} PROFILE=${PROFILE}"

          test -d "${WORKDIR}/profiles" || (echo "Missing ${WORKDIR}/profiles" && ls -la "${WORKDIR}" && exit 1)
          test -f "${WORKDIR}/profiles/${PROFILE}.packages" || (echo "Missing ${WORKDIR}/profiles/${PROFILE}.packages" && ls -la "${WORKDIR}/profiles" && exit 1)

          test -f "${WORKDIR}/profiles/${PROFILE}.preseed" || echo "WARN: ${WORKDIR}/profiles/${PROFILE}.preseed not found (auto-install may not work)"
          test -f "${WORKDIR}/profiles/${PROFILE}.postinst" || echo "INFO: ${WORKDIR}/profiles/${PROFILE}.postinst not found (ok)"
          test -f "${WORKDIR}/profiles/${PROFILE}.description" || echo "INFO: ${WORKDIR}/profiles/${PROFILE}.description not found (ok)"

      - name: Verify local deb files (catch broken/LFS/html)
        shell: bash
        run: |
          set -euxo pipefail
          cd /work
          LP="${WORKDIR}/extras/local-packages"
          if [ -d "$LP" ] && ls "$LP"/*.deb >/dev/null 2>&1; then
            echo "Checking deb headers in $LP"
            bad=0
            for f in "$LP"/*.deb; do
              echo "==> $f"
              # must start with !<arch>
              if ! head -c 8 "$f" | grep -q $'!<arch>'; then
                echo "BROKEN: $f (missing !<arch> header; likely pointer/html/truncated)"
                echo "First line:"
                head -n 1 "$f" || true
                bad=1
              fi
            done
            [ "$bad" -eq 0 ] || { echo "Found broken .deb(s) in local-packages."; exit 1; }
          else
            echo "No local debs found in $LP (or folder missing)."
          fi

      - name: Create non-root build user
        shell: bash
        run: |
          set -euxo pipefail
          id builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder:builder /work

      - name: Build ISO with simple-cdd (non-root)
        shell: bash
        run: |
          set -euxo pipefail
          cd /work

          LOCAL_PACKAGES_OPT=""
          if [ -d "${WORKDIR}/extras/local-packages" ] && ls "${WORKDIR}/extras/local-packages/"*.deb >/dev/null 2>&1; then
            LOCAL_PACKAGES_OPT="--local-packages extras/local-packages"
          fi

          su - builder -c "
            set -euxo pipefail
            cd '/work/${WORKDIR}'
            mkdir -p /work/artifacts/iso /work/artifacts/logs
            build-simple-cdd --dist '${DIST}' --profiles '${PROFILE}' \
              ${LOCAL_PACKAGES_OPT} \
              --logfile '/work/artifacts/logs/build-simple-cdd.log' --verbose
          "

      - name: Collect outputs
        shell: bash
        run: |
          set -euxo pipefail
          cd /work
          mkdir -p artifacts/iso artifacts/logs

          if ls "${WORKDIR}/images/"*.iso >/dev/null 2>&1; then
            cp -av "${WORKDIR}/images/"*.iso artifacts/iso/
          else
            echo "No ISO found in ${WORKDIR}/images/"
            find "${WORKDIR}" -maxdepth 4 -type f -name "*.iso" -print || true
            exit 1
          fi

          (cd artifacts/iso && sha256sum *.iso > SHA256SUMS.txt)

          if [ -d "${WORKDIR}/tmp/log" ]; then
            cp -av "${WORKDIR}/tmp/log" artifacts/logs/simple-cdd-tmp-log || true
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/iso-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Debian 12 ISO built with simple-cdd.

            Workdir: build-iso
            Profile: ${{ env.PROFILE }}
            Dist: ${{ env.DIST }}

            Checksums are in SHA256SUMS.txt.
          files: |
            /work/artifacts/iso/*.iso
            /work/artifacts/iso/SHA256SUMS.txt
            /work/artifacts/logs/build-simple-cdd.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional QEMU smoke test (best-effort)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_qemu_smoketest == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          ISO="$(ls -1 /work/artifacts/iso/*.iso | head -n 1)"
          qemu-system-x86_64 \
            -m 2048 \
            -cdrom "$ISO" \
            -boot d \
            -display none \
            -serial stdio \
            -no-reboot \
            -accel tcg \
            -snapshot \
            -S &
          sleep 20
          pkill -f qemu-system-x86_64 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian12-iso-${{ env.PROFILE }}
          path: |
            /work/artifacts/iso
            /work/artifacts/logs
          if-no-files-found: error
