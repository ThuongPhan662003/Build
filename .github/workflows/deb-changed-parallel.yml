name: Build DEB (changed only, parallel)

on:
  push:
    branches: ["main"]
    tags:
      - "deb-v*"
    paths:
      - "services/**"
      - "scripts/build_deb.sh"
      - ".github/workflows/deb-changed-parallel.yml"

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.detect.outputs.services_json }}
      has_services: ${{ steps.detect.outputs.has_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES='["freeswitch","fusionpbx","postgresql","php","nginx"]'

          # Base để diff
          if [[ "${GITHUB_REF}" == refs/tags/deb-v* ]]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [[ -n "${PREV_TAG}" ]]; then
              BASE="$(git rev-list -n 1 "${PREV_TAG}")"
            else
              BASE="${GITHUB_SHA}^"
            fi
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED="$(git diff --name-only "$BASE" "${GITHUB_SHA}" || true)"
          echo "$CHANGED"

          # Nếu đổi wrapper build_deb.sh -> build tất cả (vì ảnh hưởng global)
          if echo "$CHANGED" | grep -qE '^scripts/build_deb\.sh$'; then
            echo "has_services=true" >> "$GITHUB_OUTPUT"
            echo "services_json=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map file -> service theo: services/<service>/...
          SERVICES="$(
            echo "$CHANGED" \
              | awk -F/ '$1=="services" && $2!="" {print $2}' \
              | sort -u
          )"

          if [[ -z "$SERVICES" ]]; then
            echo "has_services=false" >> "$GITHUB_OUTPUT"
            echo 'services_json=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Convert list -> JSON array
          JSON='['
          first=1
          while IFS= read -r s; do
            [[ -z "$s" ]] && continue
            if [[ $first -eq 1 ]]; then first=0; else JSON+=','; fi
            JSON+="\"$s\""
          done <<< "$SERVICES"
          JSON+=']'

          echo "has_services=true" >> "$GITHUB_OUTPUT"
          echo "services_json=$JSON" >> "$GITHUB_OUTPUT"
          echo "Detected services: $JSON"

  build:
    needs: detect
    if: needs.detect.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services_json) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build DEB for ${{ matrix.service }} (container)
        shell: bash
        run: |
          set -euo pipefail
          svc="${{ matrix.service }}"

          docker run --rm \
            -v "$PWD:/work" -w /work \
            debian:bookworm bash -lc "
              set -euo pipefail
              apt-get update
              apt-get install -y build-essential devscripts debhelper fakeroot lintian rsync
              chmod +x scripts/build_deb.sh
              chmod +x services/$svc/build.sh
              scripts/build_deb.sh \"$svc\"
            "

      - name: Upload artifact (per service)
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.service }}
          path: out/deb/${{ matrix.service }}/*.deb
          if-no-files-found: error

  release:
    needs: [detect, build]
    if: startsWith(github.ref, 'refs/tags/deb-v') && needs.detect.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out/all-debs

      - name: Create Release + upload DEBs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes "DEB release for $TAG" || true
          gh release upload "$TAG" out/all-debs/**/**/*.deb --clobber
