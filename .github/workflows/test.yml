name: Download release debs to local-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to download .deb assets from (e.g., deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Download .deb assets from release tag into build-iso/extras/local-packages
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ inputs.tag }}
          # Token mặc định của GitHub Actions (không phải PAT)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DEST="build-iso/extras/local-packages"
          mkdir -p "$DEST"

          api="https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${TAG}"
          echo "Fetching release JSON: $api"

          # Dùng token mặc định để tránh rate-limit / lỗi 403
          release_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"

          # Lấy danh sách URL của asset .deb
          mapfile -t urls < <(echo "$release_json" | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url')

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "ERROR: Không tìm thấy file .deb nào trong release tag: ${TAG}"
            echo "Gợi ý: kiểm tra lại release có asset .deb hay không."
            exit 1
          fi

          echo "Found ${#urls[@]} .deb assets. Downloading to: $DEST"
          for u in "${urls[@]}"; do
            name="$(basename "$u")"
            echo "-> $name"
            curl -fL --retry 5 --retry-delay 2 -o "${DEST}/${name}" "$u"
          done

          echo "=== DONE. Files in $DEST ==="
          ls -lah "$DEST"

      - name: Upload local-packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-packages
          path: build-iso/extras/local-packages
          if-no-files-found: error
