name: Download release debs to local-packages

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo chứa Release (vd: ThuongPhan662003/Build)"
        required: true
        default: "ThuongPhan662003/Build"
      tag:
        description: "Release tag (vd: deb-v0.0.1)"
        required: true
        default: "deb-v0.0.1"

jobs:
  download:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-iso/extras/local-packages
          echo "Target dir: $(pwd)/build-iso/extras/local-packages"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Download .deb assets from Release
        shell: bash
        env:
          OWNER_REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${OWNER_REPO}/releases/tags/${TAG}"
          echo "Fetching release JSON: $api"

          # Public repo => không cần token
          release_json="$(curl -fsSL -H "Accept: application/vnd.github+json" "$api")"

          mapfile -t urls < <(echo "$release_json" | jq -r '.assets[] | select(.name|endswith(".deb")) | .browser_download_url')

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "ERROR: No .deb assets found in release tag '${TAG}' of '${OWNER_REPO}'."
            echo "Tip: kiểm tra release có đúng là upload .deb hay chưa."
            exit 1
          fi

          echo "Found ${#urls[@]} .deb assets. Downloading..."
          for u in "${urls[@]}"; do
            echo "-> $u"
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 15 \
              -o "build-iso/extras/local-packages/$(basename "$u")" \
              "$u"
          done

          echo "=== DONE. Files in build-iso/extras/local-packages ==="
          ls -lah build-iso/extras/local-packages
          echo "Count .deb:"
          find build-iso/extras/local-packages -maxdepth 1 -type f -name "*.deb" | wc -l

      # Nếu bạn muốn commit các file .deb về repo thì phải dùng token + push (mình không bật vì bạn nói bỏ token)
      - name: Upload folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-packages
          path: build-iso/extras/local-packages
          if-no-files-found: error
